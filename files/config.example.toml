# t2-mac-kde per-user settings: copy to ~/.config/t2-mac-kde/config.toml and edit.
# Everything is optional; unset keys use the generic defaults shown here.
# `--data key=value` on the pyinfra command line overrides this file.

# --- Desktop (tasks/desktop.py) ---------------------------------------------------
# panel_scale = "auto"            # internal panel (eDP-1) scale, e.g. 1.6 on a 16" Retina
# desktop_left_reserve = 0         # px strip at the panel's left edge kept free (defective line)
# cursor_theme = "breeze_cursors"  # "t2-highvis" = large white arrow, red outline (accessibility)
# cursor_size = 24                 # e.g. 48 for a much bigger pointer; SUPER+SHIFT+C flashes it
# password_store = "kwallet6"    # Chromium/Electron apps: KDE wallet (default if KDE is installed); "" = off
# gpu_mode = "battery"            # Hyprland GPUs: battery (Intel only) | external (AMD outputs too);
#                                  # first-run default, then switch with hypr-gpu battery|external
# bar_graphs = false               # CPU/MEM/net as sparklines instead of numbers
# decorations_style = "win311"     # "win311" | "mac" title bars
# window_shadows = "off"           # "off" | "mac" | "win311"
# fleet_hosts = []                 # hostnames for distinct title-bar colours (tools/hostcolor)
# [decor_colors]                   # per-host colour override: hostname = "#rrggbb"

# --- Privacy (tasks/resource_policy.py) ------------------------------------------
# crash_upload = true              # false: whoopsie masked, no uploads to errors.ubuntu.com

# yubikey_login = false           # true: touch a registered YubiKey instead of the password (docs/security-keys.md)
# cpu_mitigations_off = false     # true: mitigations=off via a GRUB drop-in, at the next reboot
# battery_charge_limit = 100      # e.g. 80 when mostly plugged in; t2-battery full|limit|status
# power_tuning = false            # runtime PM for 3 safe Intel chipset functions, nmi_watchdog off,
#                                  # writeback 15 s (T2/NVMe/Wi-Fi/SMC/ASPM untouched); powertop installed

# --- Shell (tasks/shell.py) ------------------------------------------------------
# shell_blesh = false              # ble.sh: Kali/zsh-like inline suggestions, syntax colours,
#                                  # completion menu (settings: ~/.config/bash/blerc)

# --- Nix user CLI tools (tasks/nix_tools.py, docs/nix.md) ---------------------------
# nix_tools_extra = ["nchat"]     # added on top of the default set (the usual way to add tools)
# nixpkgs attribute names, installed as one profile entry "t2-tools" (~/.nix-profile/bin first
# in PATH). Unset = the repository default (manage/nix_tools.DEFAULT_TOOLS):
# nix_tools = ["zellij", "kubectl", "kubernetes-helm", "k9s", "ktop", "bitwarden-cli", "rclone",
#              "podman-tui", "btop", "ripgrep", "fd", "bat", "jq", "fzf", "lazygit", "glow", "gh",
#              "gdu", "trippy", "multitail", "aria2", "rustup", "go", "nim", "nimble",
#              "nimlangserver", "nano-syntax-highlighting", "netcat-openbsd", "gef", "rizin", "valgrind"]
# Leaving out zellij/kubectl/kubernetes-helm/k9s/ktop/bitwarden-cli/rclone/podman-tui brings back
# their pinned release binary; [] keeps only apt and release tools.

# default_cc = ""                 # "icx": Intel oneAPI icx/icpx as CC/CXX in your shells (+ Nim);
#                                  # root, apt, DKMS and kernel builds always keep GCC
# safe_chain = false               # Aikido Safe Chain wraps npm/npx/pnpm/yarn/bun/pip/uv/poetry
# rclone_mounts = {}               # { gdrive = "GoogleDrive", onedrive = "OneDrive" }: user mounts, never fstab
# rclone_cache_size = "10G"        # VFS cache per mount
# rclone_cache_age = "24h"

# --- Fonts (tasks/fonts.py) -------------------------------------------------------
# font_rendering = "grayscale"     # "grayscale" | "rgb" (subpixel)

# --- Themes (tasks/themes.py) -----------------------------------------------------
# themes_chromium_policy = false   # write the Chromium theme policy (needs /etc/chromium)

# --- Audio (tasks/audio_effects.py) -----------------------------------------------
# Music headphones get the 3D preset, A2DP-only (never call quality) and their mic is never
# the default. Bluetooth MACs and/or device names (as in `bluetoothctl devices`), any case.
# Unset: every paired Bose headset. Other headsets (e.g. AirPods for calls) stay default.
# music_headphones = ["My QC35"]
# music_preset = "plain"          # "room" = 3D + short room reverb (more spherical, like Boom3D);
                                  # "room+" = room + exciter + gentle maximizer;
                                  # "auditorium" = measured head+room BRIR (ASH R10, CC BY-NC-SA);
                                  # "stage" = room with more space but vocals kept in front
# music_codec = "sbc"             # "sbc_xq": cleaner, but may tick when Wi-Fi uses 2.4 GHz
# music_boost_db = 0               # extra level for music headphones (+2 dB ≈ +20% louder); limiter caps peaks

# --- Speakers (tasks/speaker_dsp.py) ----------------------------------------------
# speaker_dsp = false              # MacBookPro16,1 only: Asahi-style speaker DSP (FIR crossover,
#                                  # bankstown bass, limiter); false again + re-run reverts it

# --- RDP (tasks/rdp.py) -----------------------------------------------------------
# rdp_bind = "0.0.0.0:3389"        # firewalled to tailscale0 + loopback
# rdp_egfx_codec = "clearcodec"    # "clearcodec" | "avc420"
# rdp_fps = 20
# rdp_audio_mode = "mirror"        # never "redirect" on a laptop

