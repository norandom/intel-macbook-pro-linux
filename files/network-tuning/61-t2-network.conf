# Managed by t2-mac-kde (tasks/network_tuning.py; config network_tuning, default true).
# Sender-side TCP settings: they shape what this laptop sends (uploads, the RDP server's
# stream, SSH), not downloads, whose pace the remote server decides. Receive buffers, UDP
# buffers (QUIC, Tailscale) and the queue (fq_codel) stay at the kernel/Ubuntu defaults.

# BBR instead of CUBIC: paces by measured bandwidth and delay, so random Wi-Fi loss no longer
# halves the sending rate. The kernel loads tcp_bbr when this is set.
net.ipv4.tcp_congestion_control = bbr
# Keep the congestion window across short pauses: bursty streams (remote desktop, SSH) do
# not restart from slow start after every idle moment.
net.ipv4.tcp_slow_start_after_idle = 0
# Probe for a smaller packet size only once a connection stalls: recovers from paths that
# silently drop large packets (tunnels, broken ICMP filtering).
net.ipv4.tcp_mtu_probing = 1
