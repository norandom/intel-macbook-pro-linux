# Managed by t2-mac-kde (laptop-resource-policy).
# Additive zram swap above the existing 16G disk swap (priority -1); disk swap,
# resume and hibernation stay untouched. Capped at 4 GiB logical size: with
# 64 GiB RAM, a small fast tier is enough; the source's ram/2 (~31 GiB) is not.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = lz4
swap-priority = 100
