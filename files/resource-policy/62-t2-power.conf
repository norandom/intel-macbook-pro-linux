# Managed by t2-mac-kde (resource policy, config power_tuning): fewer CPU wakeups.
# NMI watchdog: a kernel debug aid that wakes every CPU periodically.
kernel.nmi_watchdog = 0
# Flush dirty pages every 15 s instead of 5 s (journald/apps still fsync when they must).
vm.dirty_writeback_centisecs = 1500
