# Managed by t2-mac-kde (shell-user-tools): aria2c reads this on every run.
# Parallel: up to 16 connections per server, files split into 1 MiB pieces.
max-connection-per-server=16
split=16
min-split-size=1M
max-concurrent-downloads=5
# Resume partial downloads; preallocate quickly on ext4.
continue=true
file-allocation=falloc
# Flaky connections: retry with a pause, notice dead links quickly.
max-tries=10
retry-wait=5
connect-timeout=15
timeout=60
# Quieter output, still with progress.
summary-interval=0
console-log-level=warn
