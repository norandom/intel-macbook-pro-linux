# Managed by t2-mac-kde (desktop, config hibernate = true).
# Apple's firmware doesn't implement ACPI S4 for Linux: with the default mode "platform" the
# kernel hangs in the firmware call (pm_test, 2026-11-16: freezer + devices pass, platform hangs).
# "shutdown" writes the image to swap and powers off without asking the firmware; the next boot
# finds the image and restores it.
[Sleep]
HibernateMode=shutdown
