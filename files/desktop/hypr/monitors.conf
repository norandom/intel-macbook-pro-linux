# Managed by t2-mac-kde (desktop). Physical outputs: preferred mode, automatic
# position and scale (Retina panel). Your own overrides: add monitor lines to
# ~/.config/hypr/local.conf (sourced last by state.conf).
monitor = , preferred, auto, auto
# hypr-rdp's virtual output exists while the RDP server runs. Placed by "auto" it sat
# directly right of the panel: the pointer, dragged windows and right-edge snaps vanished
# onto it. Keep it apart (the pointer cannot cross a gap), at a negative x so automatic
# placement still starts the physical outputs at 0. hypr-windows returns a pointer that a
# remote session left there.
monitor = hypr-rdp, preferred, -6000x0, auto
# Internal panel scale: generated into panel.conf from config panel_scale (default auto).

# T2 MacBook (apple-gmux): the internal panel appears twice, eDP-1 on Intel (i915,
# active per the Intel-first GPU policy) and eDP-2 on the AMD side of the mux, which
# reports "connected" with no modes. As a 0x0 monitor it captured Waybar and Mako
# instances (invisible notifications). Disable only that ghost; external DP/HDMI
# outputs on the AMD GPU are unaffected.
monitor = eDP-2, disable
