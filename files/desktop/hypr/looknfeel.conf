# Managed by t2-mac-kde (desktop). Colours: cream-blue-light
# (github.com/norandom/opencode-cream-blue). Borders: see borders in state.conf.
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(4a90d9)
    col.inactive_border = rgb(d9d0c0)
    resize_on_border = true
    layout = dwindle
    # Magnetic snapping for floating windows: weak (pulls only within 4-6 px). At 10-12 px a
    # title-bar drag that snapped could stay glued to the pointer (hyprbars, 2026-11-16).
    snap {
        enabled = true
        window_gap = 4
        monitor_gap = 6
        respect_gaps = false
    }
}

decoration {
    rounding = 0
    # Light milky blur, only for windows switched to glass (hypr-glass, title bar
    # button); the rule below turns it off for everything else.
    blur {
        enabled = true
        size = 2
        passes = 1
        noise = 0.02
        brightness = 1.2
        contrast = 0.8
        vibrancy = 0
        new_optimizations = true
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    # The "wallpaper": a plain colour (no wallpaper process).
    background_color = 0xff3a3a3a
    # hyprlock: if it ever crashes, `hyprlock` can be started again to take over
    allow_session_lock_restore = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# No blur by default; hypr-glass overrides this per window (setprop).
windowrule = match:class .*, no_blur on

# Night filter (hypr-nightmode, the rabbit in the bar): a reload resets the screen
# shader, so re-apply the chosen one.
exec = ~/.local/bin/hypr-nightmode apply

# X11 apps (Xfe, NEdit, xpdf, x3270) draw at the panel's real pixels instead of being stretched
# (blurry at scale 1.6); hypr-xscale sets their DPI to match at login.
xwayland {
    force_zero_scaling = true
}
