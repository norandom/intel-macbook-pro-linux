# Managed by t2-mac-kde (desktop). Windows 3.11 title bars (hyprbars): host-colour bar,
# white centred title, square buttons on the right. Switch: hypr-deco mac|win311.
# First added = outermost: [glass][on top][minimize][close] read right to left.
plugin {
    hyprbars {
        bar_height = 22
        bar_color = rgb($host_color)
        col.text = rgb(ffffff)
        bar_text_size = 11
        bar_text_font = Sans Bold
        bar_text_align = center
        bar_buttons_alignment = right
        bar_padding = 4
        bar_button_padding = 2
        bar_precedence_over_border = true
        on_double_click = hyprctl dispatch fullscreen 1
        hyprbars-button = rgba(00000000), 22, ⊠, hyprctl dispatch killactive, rgb(ffffff)
        hyprbars-button = rgba(00000000), 22, ⊟, hyprctl dispatch t2:minimize, rgb(ffffff)
        hyprbars-button = rgba(00000000), 22, ⊤, ~/.local/bin/hypr-pin, rgb(ffffff)
        hyprbars-button = rgba(00000000), 22, ▒, ~/.local/bin/hypr-glass, rgb(ffffff)
    }
}
