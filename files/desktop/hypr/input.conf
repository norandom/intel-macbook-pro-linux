# Managed by t2-mac-kde (desktop). Source keyboard policy (group_data/all.py):
# German Apple layout without dead keys plus US. Left Option is the Mac Option key
# (lv3:lalt_switch: Option+L = @, Option+5/6 = [ ], Option+7 = |, Option+Shift+7 = \,
# Option+8/9 = { }, Option+E = EUR, Option+N = ~); Right Option acts as Super
# (altwin:swap_ralt_rwin). Alt+Tab is SUPER+Tab. hypr-kbd switches the active group;
# its choice (~/.local/state/hypr-kbd) is re-applied after every config load.
input {
    kb_layout = de,us
    kb_variant = mac_nodeadkeys,
    kb_options = compose:caps,shift:both_capslock_cancel,altwin:swap_ralt_rwin,lv3:lalt_switch
    # Taskbar activation keeps focus until the next explicit click.
    follow_mouse = 0
    sensitivity = 0
    repeat_rate = 40
    repeat_delay = 250
    numlock_by_default = true
    touchpad {
        # Double-tap-drag ends late (libinput's release delay), and the title bars (hyprbars)
        # can miss that release: the window then sticks to the pointer. Drag by pressing the
        # trackpad down instead, as on macOS. Back on: hypr-touchpad tapdrag on.
        tap-and-drag = false
    }
}

cursor {
    # Restoring/focusing a window must not move the pointer off the taskbar.
    no_warps = true
}

exec = ~/.local/bin/hypr-kbd apply --quiet
