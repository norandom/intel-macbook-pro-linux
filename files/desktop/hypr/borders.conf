# Managed by t2-mac-kde (desktop). Frames, so neighbouring title bars never melt together:
# inactive windows get a near-black line, the active one "petrol on asphalt": the host colour
# running into an oil-slick sheen (violet, teal, gold) over dark green and black.
general {
    col.active_border = rgb($host_color) rgb(6b3d8a) rgb(2d7d82) rgb(9a8f3e) rgb(2e5a2e) rgb(151515) 45deg
    col.inactive_border = rgb(151515)
}
