# Managed by t2-mac-kde (desktop). Dim 5 min, lock 10 min, screen off 11 min;
# always lock before suspend (lid close is handled by logind as before).
general {
    lock_cmd = pidof hyprlock || hyprlock
    # lock, then give hyprlock a moment to draw before the machine sleeps
    before_sleep_cmd = loginctl lock-session; sleep 1
    # Right after resume the GPUs are still re-initialising (2026-11-16: 'dpms on' 1 s after resume
    # didn't take, black panel with backlight). Switch the panel on once things settled, then retry.
    after_sleep_cmd = sleep 2; hyprctl dispatch dpms on; sleep 3; hyprctl dispatch dpms on
}
listener {
    timeout = 300
    # remembers the brightness before dimming (only dims if above 10 %) and restores exactly that
    on-timeout = ~/.local/bin/hypr-brightness screen dim 10
    on-resume = ~/.local/bin/hypr-brightness screen undim
}
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
