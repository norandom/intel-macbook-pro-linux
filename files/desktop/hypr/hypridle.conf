# Managed by t2-mac-kde (desktop). Dim 5 min, lock 10 min, screen off 11 min;
# always lock before suspend (lid close is handled by logind as before).
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}
listener {
    timeout = 300
    on-timeout = ~/.local/bin/hypr-brightness screen 10% && touch $XDG_RUNTIME_DIR/hypr-dimmed
    on-resume = [ -e $XDG_RUNTIME_DIR/hypr-dimmed ] && rm $XDG_RUNTIME_DIR/hypr-dimmed && ~/.local/bin/hypr-brightness screen 50%
}
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
