# Managed by t2-mac-kde (desktop). Laptop integration the VM source never needed:
# brightness / keyboard light / volume / media keys, screenshots, polkit, tray applets, idle.

# Ubuntu packages hyprland-qtutils (hyprland-dialog) but not hyprland-guiutils.
misc {
    disable_hyprland_guiutils_check = true
}

# Display + keyboard backlight via logind (hypr-brightness), repeat while held.
bindel = , XF86MonBrightnessUp,   exec, ~/.local/bin/hypr-brightness screen +5
bindel = , XF86MonBrightnessDown, exec, ~/.local/bin/hypr-brightness screen -5
bindel = , XF86KbdBrightnessUp,   exec, ~/.local/bin/hypr-brightness kbd +10
bindel = , XF86KbdBrightnessDown, exec, ~/.local/bin/hypr-brightness kbd -10

# Volume / mic (PipeWire via wpctl; capped at 100%), also on the lock screen; OSD via mako.
bindel = , XF86AudioRaiseVolume, exec, ~/.local/bin/hypr-volume up
bindel = , XF86AudioLowerVolume, exec, ~/.local/bin/hypr-volume down
bindl  = , XF86AudioMute,        exec, ~/.local/bin/hypr-volume mute
bindl  = , XF86AudioMicMute,     exec, ~/.local/bin/hypr-volume micmute
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous

# Screenshots, saved to ~/Screenshots at once (+ clipboard); edit modes then open Satty.
# SUPER+SHIFT+4 (macOS-style, by key position: Shift+4 is '$' on the German layout) and
# SUPER+SHIFT+S: rectangle -> editor; SUPER+SHIFT+CTRL+S: whole screen -> editor;
# SUPER+SHIFT+X: rectangle, no editor.
bindd = SUPER SHIFT, code:13, Screenshot of a rectangle (annotate), exec, ~/.local/bin/hypr-screenshot edit
bindd = SUPER SHIFT, S, Screenshot of an area (annotate), exec, ~/.local/bin/hypr-screenshot edit
bindd = SUPER SHIFT CTRL, S, Screenshot of the screen (annotate), exec, ~/.local/bin/hypr-screenshot screen
bindd = SUPER SHIFT, X, Quick area screenshot (no editor), exec, ~/.local/bin/hypr-screenshot quick

# Accessibility: SUPER+SHIFT+C flashes a huge pointer to find it (cursor theme/size: config.toml).
bindd = SUPER SHIFT, C, Find the mouse pointer, exec, ~/.local/bin/hypr-findcursor

# Session helpers: polkit password dialogs, Wi-Fi + Bluetooth tray, idle/lock.
exec-once = systemctl --user start hyprpolkitagent.service hypridle.service
exec-once = uwsm app -- nm-applet --indicator
exec-once = uwsm app -- blueman-applet
