# Managed by t2-mac-kde (desktop). Hyprland 0.53 (Ubuntu package) backport of the
# source's Lua configuration (norandom/hyperland-forky-worker-vm a1c09ec).
# Native GPU: no software-rendering environment. Select "Hyprland (uwsm-managed)" at SDDM.
# Module order follows the source hyprland.lua.

env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

source = ~/.config/hypr/hostcolor.conf    # deploy: colour of this machine (tools/hostcolor)
source = ~/.config/hypr/monitors.conf     # physical outputs
source = ~/.config/hypr/panel.conf        # deploy: internal panel scale (config panel_scale)
source = ~/.config/hypr/cursor.conf       # deploy: cursor theme + size (config cursor_theme/cursor_size)
source = ~/.config/hypr/input.conf        # German Mac layout, Right Option = Super
source = ~/.config/hypr/looknfeel.conf    # colours, snapping, no animations
source = ~/.config/hypr/bindings.conf     # keys (+ one-shot Super submap)
source = ~/.config/hypr/autostart.conf    # session target, mako, fonts
source = ~/.config/hypr/laptop.conf       # brightness/volume keys, screenshots, polkit, tray, idle
# Generated by hypr-desktop-state from the switch files (hypr-deco, hypr-shadow, hypr-layout):
# layout mode, title bar style (hyprbars) + borders, window shadows.
source = ~/.config/hypr/state.conf
# Generated by the deploy, sourced last: border / title-bar sizes snapped to whole physical
# pixels for a fractional panel_scale (else edges flicker when a window repaints, e.g. video).
source = ~/.config/hypr/pixel-snap.conf
