# Managed by t2-mac-kde (desktop). Explicit lock screen (SUPER+ESCAPE menu / hyprlock).
# Source look, flat, no blur. No automatic initial lock.
general {
    hide_cursor = false
    grace = 0
}

background {
    monitor =
    color = rgb(1a2a3f)
}

label {
    monitor =
    text = cmd[update:30000] echo "$(hostname): locked"
    color = rgb(8bb4e0)
    font_size = 22
    font_family = FiraCode Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 48
    outline_thickness = 2
    outer_color = rgb(8bb4e0)
    inner_color = rgb(243b55)
    font_color = rgb(fff8f0)
    check_color = rgb(c4933f)
    fail_color = rgb(c0392b)
    placeholder_text = password for $USER
    fade_on_empty = false
    rounding = 4
    position = 0, 0
    halign = center
    valign = center
}
