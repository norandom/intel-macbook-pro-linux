# Managed by t2-mac-kde (desktop). Once per Hyprland start (not on reload).
# hypr-desktop.target pulls in waybar, the window worker and the clipboard services
# for this session only (never in a KDE session); it stops with graphical-session.target.
# uwsm finalize exports WAYLAND_DISPLAY/DISPLAY (+ the instance signature) and marks the
# compositor ready; portals started before that fail with "cannot open display" and
# Waybar then exits waiting for org.freedesktop.portal.Desktop. Reset any early failures.
# ';' not '&&': if finalize or reset-failed returns an error early in the login, the desktop
# services (bar helpers, EasyEffects, keyring, Tailscale tray, RDP) must still start.
exec-once = uwsm finalize HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP; systemctl --user reset-failed xdg-desktop-portal.service xdg-desktop-portal-gtk.service; systemctl --user start hypr-desktop.target
# mako is D-Bus activated as mako.service; a second exec-once copy only fails.
exec-once = systemctl --user start mako.service
# hyprbars is loaded after the first config pass; reload once so its options apply.
exec-once = sleep 1 && hyprctl reload
# Fixedsys as core X fonts for NEdit (desktop-fonts feature; skipped when absent)
# then DPI for X11 apps (Xft.dpi, NEdit/x3270 fonts, Xfe) from the panel scale
exec-once = ~/.local/bin/hypr-session xfonts; ~/.local/bin/hypr-xscale
