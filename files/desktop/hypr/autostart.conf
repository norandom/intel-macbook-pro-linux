# Managed by t2-mac-kde (desktop). Once per Hyprland start (not on reload).
# hypr-desktop.target pulls in waybar, the window worker and the clipboard services
# for this session only (never in a KDE session); it stops with graphical-session.target.
exec-once = systemctl --user import-environment HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && systemctl --user start hypr-desktop.target
exec-once = uwsm app -- mako
# hyprbars is loaded after the first config pass; reload once so its options apply.
exec-once = sleep 1 && hyprctl reload
# Fixedsys as core X fonts for NEdit (desktop-fonts feature; skipped when absent)
exec-once = ~/.local/bin/hypr-session xfonts
