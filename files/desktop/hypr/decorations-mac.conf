# Managed by t2-mac-kde (desktop). macOS-like title bars (hyprbars): a pale tint of the
# host colour, navy text, close / maximize / glass / pin buttons on the left.
plugin {
    hyprbars {
        bar_height = 24
        bar_color = rgb($host_pale)
        col.text = rgb(2b4570)
        bar_text_size = 11
        bar_text_font = JetBrainsMono Nerd Font
        bar_text_align = center
        bar_buttons_alignment = left
        bar_padding = 10
        bar_precedence_over_border = true
        on_double_click = hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(ff5f57), 12, , hyprctl dispatch killactive, rgb(4d0000)
        hyprbars-button = rgb(28c840), 12, , hyprctl dispatch fullscreen 1, rgb(003300)
        hyprbars-button = rgb(8bb4e0), 12, , ~/.local/bin/hypr-glass, rgb(00347d)
        hyprbars-button = rgb(a0a0a0), 12, , ~/.local/bin/hypr-pin, rgb(333333)
    }
}
